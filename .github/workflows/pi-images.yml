# Builds a Raspberry Pi SD image (hub or office-connector) on a native aarch64-linux
# runner; the Mac has no Linux builder. Pushes touching the Pis only evaluate them.
name: pi-images

on:
  workflow_dispatch:
    inputs:
      host:
        description: Which Pi to build the SD image for
        type: choice
        options:
          - hub
          - office-connector
        default: hub
  push:
    paths:
      - "nix/nixos/**"
      - "flake.nix"
      - "flake.lock"

jobs:
  pi:
    runs-on: ubuntu-24.04-arm
    env:
      HOST: ${{ inputs.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Evaluate the Pis
        run: |
          for host in hub office-connector; do
            nix eval --raw ".#nixosConfigurations.$host.config.system.build.toplevel.drvPath"
            echo
          done
      - name: Build the SD image
        if: github.event_name == 'workflow_dispatch'
        run: nix build -L ".#$HOST-sd-image"
      - name: Upload the SD image
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.host }}-sd-image
          path: result/sd-image/*.img.zst
          compression-level: 0
          if-no-files-found: error
