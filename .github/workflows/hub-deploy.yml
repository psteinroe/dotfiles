# Deploys the Raspberry Pi hub from main: a native aarch64-linux runner evaluates and
# builds the whole system, then copies the finished closure to the Pi over Tailscale
# SSH and activates it with sudo. The Pi (1 GB) never evaluates or builds and is never
# rebooted. Off until the tailnet trust is set up and the repository variable
# HUB_DEPLOY_ENABLED is "true" (README, Home hub). hub-rebuild dispatches it.
name: hub-deploy

on:
  push:
    branches: [main]
    paths:
      - "nix/nixos/**"
      - "nix/keys/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/hub-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET: psteinroe@hub.tail6aabd2.ts.net

jobs:
  not-deployed:
    name: deployment skipped
    if: github.ref != 'refs/heads/main' || vars.HUB_DEPLOY_ENABLED != 'true'
    runs-on: ubuntu-24.04-arm
    permissions: {}
    steps:
      - name: Explain
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != refs/heads/main ]; then
            echo "::error::hub-deploy only deploys main, not $REF"
            exit 1
          fi
          echo "::notice::Skipped, the hub was not deployed: deployment is not configured (repository variable HUB_DEPLOY_ENABLED is not true, see README, Home hub)"
          echo "Skipped, the hub was not deployed: HUB_DEPLOY_ENABLED is not true." >>"$GITHUB_STEP_SUMMARY"

  deploy:
    name: deploy hub
    if: github.ref == 'refs/heads/main' && vars.HUB_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    # Restricted to main; holds the Tailscale trust credential variables
    environment: hub
    concurrency:
      group: hub-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check the deploy configuration
        env:
          CLIENT_ID: ${{ vars.HUB_TS_OAUTH_CLIENT_ID }}
          AUDIENCE: ${{ vars.HUB_TS_OIDC_AUDIENCE }}
        run: |
          missing=
          [ -n "$CLIENT_ID" ] || missing="$missing HUB_TS_OAUTH_CLIENT_ID"
          [ -n "$AUDIENCE" ] || missing="$missing HUB_TS_OIDC_AUDIENCE"
          if [ -n "$missing" ]; then
            echo "::error::HUB_DEPLOY_ENABLED is true, but the hub environment lacks:$missing (README, Home hub)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
      # Fully built in this runner's store before the runner joins the tailnet
      - name: Build the hub
        id: build
        run: |
          system=$(nix build -L --no-link --print-out-paths .#nixosConfigurations.hub.config.system.build.toplevel)
          echo "system=$system" >>"$GITHUB_OUTPUT"
      - uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ vars.HUB_TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.HUB_TS_OIDC_AUDIENCE }}
          tags: tag:hub-deploy
      # Tailscale SSH presents its own host key, new on every runner
      - name: Check the hub is reachable
        run: |
          for _ in 1 2 3 4 5 6; do
            if ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$TARGET" true; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::$TARGET is not reachable over Tailscale SSH (offline, or the tailnet policy doesn't let tag:hub-deploy in). It keeps its current system; re-run this workflow, or run hub-rebuild, once it is online."
          exit 1
      # No --build-host: nothing is evaluated or built on the Pi; --use-substitutes
      # lets it fetch what cache.nixos.org has instead of uploading it from here
      - name: Switch the hub
        env:
          NIX_SSHOPTS: -o StrictHostKeyChecking=accept-new
        run: >-
          nix run --no-write-lock-file --inputs-from . nixpkgs#nixos-rebuild-ng -- switch --flake '.#hub'
          --target-host "$TARGET" --elevate sudo --use-substitutes
      - name: Summary
        env:
          SYSTEM: ${{ steps.build.outputs.system }}
        run: |
          ssh() { command ssh -o StrictHostKeyChecking=accept-new "$TARGET" "$@"; }
          current=$(ssh readlink -f /run/current-system)
          if [ "$current" != "$SYSTEM" ]; then
            echo "::error::The hub runs $current, expected $SYSTEM"
            exit 1
          fi
          {
            echo "Deployed $GITHUB_SHA to $TARGET"
            echo
            echo "System: \`$SYSTEM\`"
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$(ssh readlink -f /run/booted-system/kernel)" != "$(ssh readlink -f /run/current-system/kernel)" ]; then
            echo "::notice::New kernel, active after a reboot: ssh $TARGET sudo reboot"
            echo "New kernel, active after a reboot: \`ssh $TARGET sudo reboot\`" >>"$GITHUB_STEP_SUMMARY"
          fi
