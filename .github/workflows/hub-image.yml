# Builds the Raspberry Pi hub's SD image on a native aarch64-linux runner; the Mac
# has no Linux builder. Pushes touching the hub only evaluate it.
name: hub-image

on:
  workflow_dispatch:
  push:
    paths:
      - "nix/nixos/**"
      - "flake.nix"
      - "flake.lock"

jobs:
  hub:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Evaluate the hub
        run: nix eval --raw .#nixosConfigurations.hub.config.system.build.toplevel.drvPath
      - name: Build the SD image
        if: github.event_name == 'workflow_dispatch'
        run: nix build -L .#hub-sd-image
      - name: Upload the SD image
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: hub-sd-image
          path: result/sd-image/*.img.zst
          compression-level: 0
          if-no-files-found: error
